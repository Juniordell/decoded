[project]
name = "decoded-api"
version = "0.1.0"
description = "Decoded API — turns AI papers into content everyone understands"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi (>=0.115.0,<0.120.0)",
    "uvicorn[standard] (>=0.32.0,<0.35.0)",
    "pydantic (>=2.9.0,<3.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "structlog (>=24.4.0,<25.0.0)",
    "sqlalchemy[asyncio] (>=2.0)",
    "asyncpg (>=0.30)",
    "alembic (>=1.14)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.0"
ruff = "^0.7.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"