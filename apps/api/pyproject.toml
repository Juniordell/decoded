[project]
name = "decoded-api"
version = "0.1.0"
description = "Decoded API — turns AI papers into content everyone understands"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.32.0,<0.35.0)",
    "pydantic (>=2.9.0,<3.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "structlog (>=24.4.0,<25.0.0)",
    "sqlalchemy[asyncio] (>=2.0)",
    "asyncpg (>=0.30)",
    "alembic (>=1.14)",
    "httpx (>=0.28.1,<0.29.0)",
    "arxiv (>=4.0.1,<5.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "llama-parse (>=0.6.94,<0.7.0)",
    "openai (>=2.0.0,<4.0.0)",
    "qdrant-client (>=1.19.0,<2.0.0)",
    "tiktoken (>=0.14.0,<0.15.0)",
    "prefect (>=3.8.3,<4.0.0)",
    "anthropic (>=0.122.0,<0.123.0)",
    "instructor (>=1.15.4,<2.0.0)",
    "pymupdf (>=1.28.2,<2.0.0)",
    "cohere (>=7.0.9,<8.0.0)",
    "pyjwt[crypto] (>=2.13.0,<3.0.0)",
    "langfuse (>=4.14.5,<5.0.0)",
    "dspy-ai (>=3.3.1,<4.0.0)",
    "dspy[optuna] (>=3.3.1,<4.0.0)",
    "redis[hiredis] (>=5.0)",
    "bertopic (>=0.17.4,<0.18.0)",
    "umap-learn (>=0.5.12,<0.6.0)",
    "hdbscan (>=0.8.44,<0.9.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "resend (>=2.42.0,<3.0.0)",
    "svix (>=2.2.0,<3.0.0)",
    "posthog (>=7.45.1,<8.0.0)",
    "elevenlabs (>=2.65.0,<3.0.0)",
    "boto3 (>=1.43.86,<2.0.0)",
    "mutagen (>=1.48.1,<2.0.0)",
]

[tool.poetry]
packages = [{include = "decoded", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.0"
ruff = "^0.7.0"
ragas = "^0.4.3"
datasets = "^5.0.1"
textstat = "^0.7.13"
pandas = ">=2.2,<3"
mlflow = "^3.15.2"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"