# fly.toml app configuration file generated for decoded-api on 2026-09-02T09:10:24-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'decoded-api'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'
  release_command = 'alembic upgrade head'

[env]
  LOG_LEVEL = 'INFO'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 120
    soft_limit = 80

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
